name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: |
          node -v
          npm -v
          npm ci || (echo "=== NPM ERROR LOG ===" && (cat ~/.npm/_logs/* || true) && exit 1)

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript & Production Build
        run: npm run build

  backend:
    name: Backend Tests & Acceptance Scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run In-Memory Security & Logic Tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-cryptographic-signing-key-32chars
          DATABASE_URL: sqlite:///./test_ci.db
          CORS_ORIGINS: http://localhost:5173
        run: |
          python tests/test_security_and_logic.py

      - name: Start FastAPI Backend in Background
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-cryptographic-signing-key-32chars
          DATABASE_URL: sqlite:///./test_ci.db
          CORS_ORIGINS: http://localhost:5173
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          echo "Started Uvicorn process with PID $(cat uvicorn.pid)"

      - name: Wait for Backend Health Endpoint
        run: |
          echo "Waiting for http://127.0.0.1:8001/api/health..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8001/api/health > /dev/null 2>&1; then
              echo "Backend is healthy and ready!"
              exit 0
            fi
            echo "Attempt $i/30: Backend not ready yet, sleeping 1s..."
            sleep 1
          done
          echo "Backend failed to start within 30 seconds. Server log:"
          cat uvicorn.log
          exit 1

      - name: Run End-to-End Acceptance Scenarios
        env:
          TEST_API_BASE: http://127.0.0.1:8001
        run: |
          python tests/verify_scenarios.py

      - name: Shutdown Background Server & Output Logs
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            PID=$(cat uvicorn.pid)
            echo "Stopping Uvicorn PID $PID..."
            kill $PID 2>/dev/null || true
          fi
          if [ -f uvicorn.log ]; then
            echo "=== Uvicorn Server Logs ==="
            cat uvicorn.log
          fi
